<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>W or L Tribunal — No Cap, No Mercy</title>
  <meta name="description" content="Drop anything. The Tribunal judges it. W, L, MID, S TIER, or COOKED — no cap, no mercy."/>
  <meta property="og:title" content="W or L Tribunal"/>
  <meta property="og:description" content="Drop anything. The AI judges it. No cap, no mercy."/>
  <meta property="og:url" content="https://worltribunal.com"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&display=swap"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:   #FFD700;
      --green:  #00FF88;
      --orange: #FF9500;
      --red:    #FF3B5C;
      --hot:    #FF0040;
    }

    body {
      min-height: 100vh;
      background: #000;
      font-family: 'Space Mono', monospace;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 80px;
      position: relative;
      overflow-x: hidden;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
      background-size: 58px 58px;
      pointer-events: none;
      z-index: 0;
    }

    #scanline {
      position: fixed;
      left: 0; right: 0;
      height: 3px;
      background: rgba(255,255,255,0.04);
      animation: scan 5s linear infinite;
      pointer-events: none;
      z-index: 999;
    }

    .wrap {
      width: 100%;
      max-width: 580px;
      position: relative;
      z-index: 1;
    }

    /* ── HEADER ── */
    .header { text-align: center; margin-bottom: 40px; }
    .header-sub {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(11px, 2.4vw, 14px);
      color: #333;
      letter-spacing: 9px;
      margin-bottom: 4px;
    }
    .header h1 {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(50px, 14.5vw, 98px);
      line-height: .88;
      letter-spacing: 3px;
      background: linear-gradient(115deg, #fff 0%, #555 44%, #fff 100%);
      background-size: 230% 230%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 4s ease infinite;
    }
    .header-sub2 {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(11px, 2.4vw, 14px);
      color: #333;
      letter-spacing: 9px;
      margin-top: 5px;
    }

    /* ── INPUT ── */
    .input-box {
      border: 1px solid #242424;
      background: rgba(255,255,255,0.022);
      animation: glowPulse 3.2s ease-in-out infinite;
    }
    textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      font-family: 'Space Mono', monospace;
      font-size: clamp(13px, 2.1vw, 15px);
      padding: 18px 18px 0;
      resize: none;
    }
    textarea:focus { outline: none; }
    .input-footer {
      padding: 7px 18px 13px;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #2e2e2e;
      letter-spacing: 2px;
    }

    /* ── BUTTONS ── */
    .btn-primary {
      width: 100%;
      margin-top: 10px;
      padding: 17px;
      border: none;
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(16px, 4vw, 22px);
      letter-spacing: 5px;
      cursor: pointer;
      transition: transform .14s ease;
    }
    .btn-primary:hover:not(:disabled) { transform: scale(1.03); }
    .btn-primary:active:not(:disabled) { transform: scale(0.97); }
    .btn-primary:disabled { cursor: not-allowed; }

    .btn-active {
      background: linear-gradient(135deg, #fff 0%, #c0c0c0 100%);
      color: #000;
    }
    .btn-inactive {
      background: rgba(255,255,255,0.035);
      color: #2e2e2e;
    }

    /* ── SPINNER ── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #2e2e2e;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .72s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }

    /* ── RESULT CARD ── */
    .result-card {
      width: 100%;
      margin-top: 26px;
      padding: 26px;
      position: relative;
      overflow: hidden;
      animation: up .38s ease forwards;
    }
    .result-card.shaky { animation: shake .68s ease forwards !important; }

    .corner { position: absolute; width: 48px; height: 48px; }
    .corner-tl { top: 0; left: 0; }
    .corner-br { bottom: 0; right: 0; }

    .grade-text {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(58px, 21vw, 144px);
      line-height: .88;
      letter-spacing: 4px;
      text-align: center;
      animation: up .42s ease forwards, pulse 2.3s ease-in-out .5s infinite;
    }
    .emoji-row { font-size: 26px; text-align: center; margin-top: 7px; animation: up .5s ease .22s both; }
    .score-label { font-family: 'Bebas Neue', cursive; font-size: 11px; color: #3a3a3a; letter-spacing: 3px; }
    .score-num { font-family: 'Bebas Neue', cursive; font-size: 18px; }
    .score-bar-bg { height: 3px; background: rgba(255,255,255,0.07); margin-top: 6px; }
    .score-bar-fill { height: 100%; transition: width 1.1s cubic-bezier(.16,1,.3,1) .28s; }

    .verdict-text {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(16px, 4.8vw, 26px);
      color: #fff;
      letter-spacing: 2px;
      line-height: 1.2;
      margin: 14px 0;
      animation: up .5s ease .22s both;
    }
    .roast-text {
      font-size: 13px;
      color: #666;
      line-height: 1.78;
      font-style: italic;
      padding-left: 13px;
      animation: up .5s ease .32s both;
    }

    .btn-share {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: none;
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(15px, 4vw, 20px);
      letter-spacing: 5px;
      color: #000;
      cursor: pointer;
      transition: transform .14s ease;
      animation: popIn .4s ease .6s both;
    }
    .btn-share:hover { transform: scale(1.03); }
    .btn-share:active { transform: scale(0.97); }

    /* ── SHARE MODAL ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(8px);
    }
    .modal-inner { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 10px; }

    .share-card {
      background: #000;
      padding: 26px 22px 18px;
      position: relative;
    }
    .share-corner { position: absolute; width: 18px; height: 18px; }

    .share-grade {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(52px, 18vw, 88px);
      line-height: .88;
      letter-spacing: 3px;
      text-align: center;
    }
    .share-submitted {
      background: rgba(255,255,255,0.04);
      border: 1px solid #1a1a1a;
      padding: 10px 14px;
      margin: 12px 0;
      font-size: 12px;
      color: #888;
      font-style: italic;
    }
    .share-verdict {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(14px, 4vw, 20px);
      color: #fff;
      letter-spacing: 1.5px;
      line-height: 1.25;
      margin-bottom: 10px;
    }
    .share-roast { font-size: 11px; color: #555; line-height: 1.7; font-style: italic; padding-left: 10px; }
    .share-watermark { margin-top: 14px; text-align: right; font-family: 'Bebas Neue', cursive; font-size: 10px; color: #222; letter-spacing: 3px; }

    .share-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-social {
      padding: 14px;
      border: none;
      font-family: 'Bebas Neue', cursive;
      font-size: 15px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: transform .14s ease;
    }
    .btn-social:hover { transform: scale(1.03); }
    .btn-twitter { background: #1DA1F2; color: #000; }
    .btn-tiktok { background: linear-gradient(135deg, #ff0050, #00f2ea); color: #fff; }

    .btn-copy {
      padding: 14px;
      border: 1px solid #2a2a2a;
      font-family: 'Bebas Neue', cursive;
      font-size: 15px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: all .2s ease;
    }
    .caption-preview {
      background: rgba(255,255,255,0.03);
      border: 1px solid #1a1a1a;
      padding: 12px 14px;
      font-size: 11px;
      color: #444;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .btn-close {
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #333;
      font-family: 'Bebas Neue', cursive;
      font-size: 13px;
      letter-spacing: 4px;
      padding: 12px;
      cursor: pointer;
      transition: border-color .2s;
    }
    .btn-close:hover { border-color: #555; color: #888; }

    /* ── PARTICLES ── */
    .particle {
      position: fixed;
      width: 7px; height: 7px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 200;
      bottom: -12px;
    }

    /* ── FOOTER ── */
    .footer {
      margin-top: 44px;
      color: #181818;
      font-size: 10px;
      letter-spacing: 3px;
      text-align: center;
      font-family: 'Bebas Neue', cursive;
    }

    /* ── KEYFRAMES ── */
    @keyframes floatUp { 0%{transform:translateY(0)scale(1);opacity:1} 100%{transform:translateY(-110vh)scale(0);opacity:0} }
    @keyframes shake { 0%,100%{transform:translateX(0)} 15%{transform:translateX(-14px)rotate(-2.5deg)} 30%{transform:translateX(14px)rotate(2.5deg)} 50%{transform:translateX(-8px)rotate(-1deg)} 70%{transform:translateX(8px)rotate(1deg)} 85%{transform:translateX(-4px)} }
    @keyframes scan { 0%{top:-4px} 100%{top:100vh} }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.82;transform:scale(1.018)} }
    @keyframes up { from{transform:translateY(32px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
    @keyframes shimmer { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    @keyframes glowPulse { 0%,100%{box-shadow:0 0 8px rgba(255,255,255,0.05)} 50%{box-shadow:0 0 26px rgba(255,255,255,0.14)} }
    @keyframes popIn { 0%{transform:scale(0.85);opacity:0} 70%{transform:scale(1.04)} 100%{transform:scale(1);opacity:1} }
  </style>
</head>
<body>
  <div id="scanline"></div>

  <div class="wrap">
    <!-- HEADER -->
    <div class="header">
      <p class="header-sub">THE OFFICIAL</p>
      <h1>W OR L<br/>TRIBUNAL</h1>
      <p class="header-sub2">NO CAP · NO MERCY</p>
    </div>

    <!-- INPUT -->
    <div class="input-box">
      <textarea
        id="input"
        rows="3"
        maxlength="200"
        placeholder='e.g. "wearing crocs to prom"'
        oninput="onInput()"
        onkeydown="onKey(event)"
      ></textarea>
      <div class="input-footer">
        <span>DROP ANYTHING. WE JUDGE.</span>
        <span id="char-count">0/200</span>
      </div>
    </div>

    <button id="submit-btn" class="btn-primary btn-inactive" disabled onclick="handleRate()">
      SEND IT TO THE TRIBUNAL →
    </button>

    <!-- RESULT (hidden until rated) -->
    <div id="result-card" class="result-card" style="display:none"></div>
  </div>

  <p class="footer">POWERED BY THE TRIBUNAL · NO BIAS · JUST FACTS</p>

  <!-- SHARE MODAL -->
  <div id="share-modal" class="modal-overlay" style="display:none" onclick="closeModal(event)">
    <div class="modal-inner" onclick="event.stopPropagation()">
      <div id="share-card" class="share-card"></div>
      <div class="share-btns">
        <button class="btn-social btn-twitter" onclick="openTwitter()">𝕏 / TWITTER</button>
        <button class="btn-social btn-tiktok" onclick="openTikTok()">TIKTOK</button>
      </div>
      <button id="copy-btn" class="btn-copy" onclick="copyCaption()" style="background:rgba(255,255,255,0.06);color:#888">📋 COPY CAPTION</button>
      <div id="caption-preview" class="caption-preview"></div>
      <button class="btn-close" onclick="document.getElementById('share-modal').style.display='none'">✕ CLOSE</button>
    </div>
  </div>

  <script>
    // ── Config ────────────────────────────────────────────────────────
    // Change this to your deployed Vercel URL once live
    // e.g. "https://worltribunal.vercel.app" or "https://worltribunal.com"
    const API_BASE = window.location.origin;

    // ── State ─────────────────────────────────────────────────────────
    let currentResult = null;
    let currentInput  = "";
    let scoreTarget   = 0;
    let scoreFrame    = null;
    const particles   = [];

    const GRADE_COLORS = {
      "S TIER": "#FFD700",
      "W":      "#00FF88",
      "MID":    "#FF9500",
      "L":      "#FF3B5C",
      "COOKED": "#FF0040",
    };

    const SUGGESTIONS = [
      "wearing crocs to prom","texting your ex at 2am","eating cereal with water",
      "skipping the gym for the 3rd week","matching pfp with your situationship",
      "buying another stanley cup","going to sleep before midnight",
      "starting a podcast nobody asked for","putting pineapple on pizza",
      "wearing the same hoodie for a week","ghosting someone after 3 dates",
    ];
    let phIdx = 0;
    setInterval(() => {
      phIdx = (phIdx + 1) % SUGGESTIONS.length;
      const el = document.getElementById("input");
      if (!el.value) el.placeholder = `e.g. "${SUGGESTIONS[phIdx]}"`;
    }, 2600);

    // ── Local fallback engine (used if API is unavailable) ─────────────
    const SIGNALS = {
      s: ["gym","workout","read","study","meditate","grind","hustle","invest","learn","journal","hydrate","sunrise","marathon","volunteer","graduate","thesis","startup","cook","chef"],
      w: ["friend","family","dog","cat","pizza","nap","sleep early","hiking","camping","coffee","morning routine","concert","road trip","sunset","beach","therapy","honest","apologize","forgive","help","donate","create","art","music","write","book"],
      l: ["ex","2am","crying","drunk text","ghosted","ghosting","blocked","procrastinate","lie","cheat","steal","fight","broke","debt","gamble","bet","vape","smoke","overslept","missed","late","failed","quit","give up","cringe"],
      cooked: ["cereal with water","mayo on everything","expired","mold","garbage","illegal","prison","felony","snitch","betrayed","skip shower","not shower"],
    };
    const VERDICTS = {
      "S TIER":["UNDERSTOOD THE ASSIGNMENT, PERIODT 👑","GOATED WITH THE SAUCE NO CAP","THE ANCESTORS ARE PROUD RN","CERTIFIED MAIN CHARACTER BEHAVIOR"],
      "W":     ["LOWKEY BASED BEHAVIOR FR FR","YOU ATE AND LEFT NO CRUMBS","VALID MOVE, KEEP COOKING","THIS SLAPS AND YOU KNOW IT"],
      "MID":   ["MID AS A TUESDAY AFTERNOON","GIVING PARTICIPATION TROPHY ENERGY","LUKEWARM LIKE GAS STATION COFFEE","AVERAGE ENJOYER MOMENT"],
      "L":     ["THIS AIN'T IT CHIEF, NOT AT ALL","THE AUDACITY IS SENDING ME FR","CERTIFIED L BEHAVIOR, RESPECTFULLY","YOUR ANCESTORS ARE SHAKING THEIR HEADS"],
      "COOKED":["ABSOLUTELY COOKED, NO SURVIVORS","GAME OVER. DELETE YOUR ACCOUNT.","THIS VIOLATED EVERY KNOWN LAW OF RIZZ","COOKED BEYOND RECOGNITION. RIP."],
    };
    const ROASTS = {
      "S TIER":["ngl you actually understood the assignment. this is giving main character energy fr fr. lowkey inspirational no cap.","bussin bussin no cap. the rizz levels are astronomical. you ate, you slayed, you conquered fr."],
      "W":     ["ngl this actually hits different. not legendary but definitely a W fr fr. the tribunal sees you.","lowkey based, not gonna cap. solid W behavior, keep this energy no cap."],
      "MID":   ["ngl this is the most mid thing i've seen today. not cooked but not bussin either. just... existing fr.","giving beige wall energy. technically a choice but like... why tho. mid is the verdict fr fr."],
      "L":     ["ngl this is rough to witness. respectfully, you cooked yourself. the L is deserved fr fr no cap.","this is giving 'i woke up and chose chaos' energy. major L behavior and you know it deep down fr."],
      "COOKED":["absolutely cooked beyond recovery fr fr. this violated the geneva convention of rizz. no survivors.","you are so cooked the smoke alarm went off in another dimension. the ancestors have left the groupchat fr."],
    };
    const EMOJIS = {
      "S TIER":["👑✨🔥💯🙌","👑🏆✨💎🔥"],
      "W":     ["🔥✅💪😤🙏","💯🔥🙌😤👌"],
      "MID":   ["😐🤷📊💤🫠","😑🤔💭🫥😶"],
      "L":     ["💀😬🫣😭🚩","❌😭💔🫠🚩"],
      "COOKED":["💀🔥☠️🗑️😵","☠️💀🚨🔥🗑️"],
    };

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function localRate(text) {
      const t = text.toLowerCase();
      let score = 50;
      SIGNALS.s.forEach(k => { if (t.includes(k)) score += 18; });
      SIGNALS.w.forEach(k => { if (t.includes(k)) score += 8; });
      SIGNALS.l.forEach(k => { if (t.includes(k)) score -= 12; });
      SIGNALS.cooked.forEach(k => { if (t.includes(k)) score -= 25; });
      if (text.length > 80) score += 4;
      if (/\b[1-4]\s?am\b/.test(t)) score -= 10;
      if (/\b[6-9]\s?am\b/.test(t) || /morning/.test(t)) score += 8;
      score = Math.max(2, Math.min(98, score + Math.floor(Math.random()*12)-6));
      let grade = score>=88?"S TIER":score>=68?"W":score>=45?"MID":score>=25?"L":"COOKED";
      return { grade, score:Math.round(score), verdict:pick(VERDICTS[grade]), roast:pick(ROASTS[grade]), emoji_sequence:pick(EMOJIS[grade]) };
    }

    // ── Input handling ─────────────────────────────────────────────────
    function onInput() {
      const v = document.getElementById("input").value;
      document.getElementById("char-count").textContent = `${v.length}/200`;
      const btn = document.getElementById("submit-btn");
      if (v.trim()) {
        btn.disabled = false;
        btn.className = "btn-primary btn-active";
      } else {
        btn.disabled = true;
        btn.className = "btn-primary btn-inactive";
      }
    }
    function onKey(e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleRate(); }
    }

    // ── Main rate function ─────────────────────────────────────────────
    async function handleRate() {
      const input = document.getElementById("input").value.trim();
      if (!input) return;

      currentInput = input;
      setLoading(true);

      let result;
      try {
        const res = await fetch(`${API_BASE}/api/rate`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ input }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        result = await res.json();
        if (!result.grade) throw new Error("Invalid response");
      } catch (err) {
        console.warn("API failed, using local fallback:", err.message);
        // Graceful fallback to local engine
        await new Promise(r => setTimeout(r, 1200 + Math.random()*600));
        result = localRate(input);
      }

      currentResult = result;
      setLoading(false);
      renderResult(result);
      spawnParticles();
      if (result.grade === "L" || result.grade === "COOKED") shakeCard();
    }

    function setLoading(on) {
      const btn = document.getElementById("submit-btn");
      if (on) {
        btn.disabled = true;
        btn.className = "btn-primary btn-inactive";
        btn.innerHTML = `<span class="spinner"></span>TRIBUNAL IS DELIBERATING…`;
      } else {
        btn.disabled = false;
        btn.className = "btn-primary btn-active";
        btn.innerHTML = "SEND IT TO THE TRIBUNAL →";
      }
    }

    // ── Render result ──────────────────────────────────────────────────
    function renderResult(r) {
      const gc = GRADE_COLORS[r.grade] || "#fff";
      const card = document.getElementById("result-card");

      card.style.display = "block";
      card.style.border = `1px solid ${gc}3d`;
      card.style.background = `linear-gradient(135deg,${gc}0a 0%,transparent 52%)`;
      card.className = "result-card";

      card.innerHTML = `
        <div class="corner corner-tl" style="border-top:2px solid ${gc};border-left:2px solid ${gc}"></div>
        <div class="corner corner-br" style="border-bottom:2px solid ${gc};border-right:2px solid ${gc}"></div>

        <div style="text-align:center;margin-bottom:18px">
          <div class="grade-text" style="color:${gc};text-shadow:0 0 48px ${gc},0 0 96px ${gc}66">${r.grade}</div>
          <div class="emoji-row">${r.emoji_sequence}</div>
        </div>

        <div style="margin-bottom:20px">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px">
            <span class="score-label">HYPE SCORE</span>
            <span class="score-num" id="score-num" style="color:${gc}">0/100</span>
          </div>
          <div class="score-bar-bg">
            <div class="score-bar-fill" id="score-bar" style="width:0%;background:linear-gradient(90deg,${gc}66,${gc});box-shadow:0 0 9px ${gc}"></div>
          </div>
        </div>

        <div class="verdict-text">"${r.verdict}"</div>
        <div class="roast-text" style="border-left:2px solid ${gc}2e">${r.roast}</div>

        <button class="btn-share" onclick="openShareModal()"
          style="background:linear-gradient(135deg,${gc} 0%,${gc}bb 100%);box-shadow:0 0 20px ${gc}44">
          🚀 SHARE THIS VERDICT
        </button>
      `;

      // Animate score counter
      animateScore(r.score, gc);
      // Scroll into view on mobile
      setTimeout(() => card.scrollIntoView({ behavior: "smooth", block: "nearest" }), 100);
    }

    function animateScore(target, color) {
      if (scoreFrame) cancelAnimationFrame(scoreFrame);
      let cur = 0;
      const numEl  = document.getElementById("score-num");
      const barEl  = document.getElementById("score-bar");
      const step = () => {
        cur = Math.min(target, cur + Math.ceil((target - cur) / 6) + 1);
        if (numEl) numEl.textContent = `${cur}/100`;
        if (barEl) barEl.style.width = `${cur}%`;
        if (cur < target) scoreFrame = requestAnimationFrame(step);
      };
      setTimeout(() => requestAnimationFrame(step), 300);
    }

    function shakeCard() {
      const card = document.getElementById("result-card");
      card.classList.add("shaky");
      setTimeout(() => card.classList.remove("shaky"), 700);
    }

    // ── Particles ──────────────────────────────────────────────────────
    function spawnParticles() {
      const palette = ["#FFD700","#00FF88","#FF9500","#FF3B5C","#fff","#a78bfa","#f472b6","#38bdf8"];
      for (let i = 0; i < 28; i++) {
        const el = document.createElement("div");
        el.className = "particle";
        el.style.left = `${Math.random()*100}%`;
        el.style.background = palette[Math.floor(Math.random()*palette.length)];
        const dur = 2.5 + Math.random()*2.5;
        const delay = Math.random()*0.9;
        el.style.animation = `floatUp ${dur}s ease-in ${delay}s forwards`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), (dur + delay + 0.1) * 1000);
      }
    }

    // ── Share modal ────────────────────────────────────────────────────
    const TWEET_TEMPLATES = {
      "S TIER": [`just got S TIER on the W or L Tribunal 👑 "{i}" — "{v}" fr fr i'm built different`],
      "W":      [`the W or L Tribunal rated "{i}" a W ({s}/100) 🔥 "{v}"`],
      "MID":    [`the tribunal called "{i}" MID ({s}/100) 😐 "{v}" ...they're not wrong`],
      "L":      [`the W or L Tribunal just gave me an L for "{i}" ({s}/100) 💀 "{v}"`],
      "COOKED": [`the W or L Tribunal said "{i}" is COOKED ({s}/100) 💀☠️ "{v}"`],
    };

    function buildCaption(r, input) {
      const tpl = pick(TWEET_TEMPLATES[r.grade]);
      return tpl
        .replace(/\{i\}/g, input.slice(0,40) + (input.length>40?"…":""))
        .replace(/\{v\}/g, r.verdict.replace(/[👑🔥💀☠️😐]/gu,"").trim().slice(0,55))
        .replace(/\{s\}/g, r.score)
        + "\n\nworltribunal.com";
    }

    function openShareModal() {
      if (!currentResult) return;
      const r  = currentResult;
      const gc = GRADE_COLORS[r.grade] || "#fff";
      const caption = buildCaption(r, currentInput);

      // Build share card HTML
      document.getElementById("share-card").style.border = `2px solid ${gc}`;
      document.getElementById("share-card").style.boxShadow = `0 0 40px ${gc}44,0 0 80px ${gc}22`;
      document.getElementById("share-card").innerHTML = `
        <div class="share-corner" style="top:0;left:0;border-top:3px solid ${gc};border-left:3px solid ${gc}"></div>
        <div class="share-corner" style="top:0;right:0;border-top:3px solid ${gc};border-right:3px solid ${gc}"></div>
        <div class="share-corner" style="bottom:0;left:0;border-bottom:3px solid ${gc};border-left:3px solid ${gc}"></div>
        <div class="share-corner" style="bottom:0;right:0;border-bottom:3px solid ${gc};border-right:3px solid ${gc}"></div>

        <p style="font-family:'Bebas Neue',cursive;font-size:11px;color:#333;letter-spacing:7px;text-align:center;margin-bottom:4px">THE W OR L TRIBUNAL</p>
        <div class="share-grade" style="color:${gc};text-shadow:0 0 30px ${gc},0 0 60px ${gc}66">${r.grade}</div>
        <div style="text-align:center;font-size:22px;margin:4px 0">${r.emoji_sequence}</div>

        <div class="share-submitted">"${currentInput.slice(0,80)}${currentInput.length>80?"…":""}"</div>

        <div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;margin-bottom:5px">
            <span style="font-family:'Bebas Neue',cursive;font-size:10px;color:#333;letter-spacing:3px">HYPE SCORE</span>
            <span style="font-family:'Bebas Neue',cursive;font-size:16px;color:${gc}">${r.score}/100</span>
          </div>
          <div style="height:3px;background:rgba(255,255,255,0.07)">
            <div style="height:100%;width:${r.score}%;background:linear-gradient(90deg,${gc}66,${gc});box-shadow:0 0 8px ${gc}"></div>
          </div>
        </div>

        <div class="share-verdict">"${r.verdict}"</div>
        <div class="share-roast" style="border-left:2px solid ${gc}22">${r.roast}</div>
        <div class="share-watermark">WORLTRIBUNAL.COM</div>
      `;

      document.getElementById("caption-preview").textContent = caption;

      const copyBtn = document.getElementById("copy-btn");
      copyBtn.style.background = "rgba(255,255,255,0.06)";
      copyBtn.style.color = "#888";
      copyBtn.textContent = "📋 COPY CAPTION";

      document.getElementById("share-modal").style.display = "flex";
    }

    function closeModal(e) {
      if (e.target.id === "share-modal") document.getElementById("share-modal").style.display = "none";
    }

    function openTwitter() {
      const caption = buildCaption(currentResult, currentInput);
      window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(caption)}`, "_blank");
    }

    function openTikTok() {
      const caption = buildCaption(currentResult, currentInput);
      navigator.clipboard.writeText(caption).then(() => {
        window.open("https://www.tiktok.com/upload", "_blank");
      });
    }

    function copyCaption() {
      const caption = buildCaption(currentResult, currentInput);
      navigator.clipboard.writeText(caption).then(() => {
        const btn = document.getElementById("copy-btn");
        btn.textContent = "✓ COPIED — GO POST IT";
        btn.style.background = "#00FF88";
        btn.style.color = "#000";
        btn.style.borderColor = "#00FF88";
        setTimeout(() => {
          btn.textContent = "📋 COPY CAPTION";
          btn.style.background = "rgba(255,255,255,0.06)";
          btn.style.color = "#888";
          btn.style.borderColor = "#2a2a2a";
        }, 2200);
      });
    }
  </script>
</body>
</html>
